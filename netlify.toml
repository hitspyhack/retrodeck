# Netlify: the deploy folder is built, not committed.
#
# `npm run deploy:prepare` writes dist/ and then proves it holds every file the
# app asks for (index.html refs + the whole ES module graph), so a new module that
# forgot to be copyable fails the build instead of 404-ing on someone's phone.

[build]
  command = "npm run deploy:prepare"
  publish = "dist"

[build.environment]
  # no dependencies to install; the check needs a modern enough node
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

# no-cache on the shell so an installed PWA notices a new sw.js on the next visit
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# a mirrored payload never changes under the same path (refetch it with --force
# and it lands as a new build), so it is safe to pin for a year
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
