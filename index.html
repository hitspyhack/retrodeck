<!doctype html>
<html lang="en" data-theme="midnight" data-density="cozy">
<head>
<meta charset="utf-8">
<title>RetroDeck · a pocket full of consoles</title>
<meta name="description" content="RetroDeck is an offline-first emulator deck for phones: 26 consoles, 61 hardware models, skins, per-model controls, and 488 classic titles indexed. Bring your own cartridges, or play six built-in originals right now.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f0e9" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroDeck">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="same-origin">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/pad.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<div class="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="RetroDeck home">
      <i class="brand__mark" aria-hidden="true"></i>
      <span>RetroDeck</span>
    </a>
    <div class="topbar__spacer"></div>
    <form class="search" id="search" role="search" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
      </svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="Search 488 titles…" aria-label="Search the game index">
      <button class="icon" type="button" data-act="clear-search" aria-label="Clear search" hidden>✕</button>
    </form>
    <span class="dot" id="netdot" title="checking emulator…" aria-label="Emulator availability"></span>
    <button class="icon" id="btn-fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite">
    <div class="empty" style="margin-top:24vh">
      <h3>Loading the deck…</h3>
      <p class="small">If this stays on screen, the JavaScript modules could not be fetched. Serve this folder over http:// (for example <code>npm run dev</code>) — <code>file://</code> blocks ES modules in some browsers.</p>
    </div>
  </main>

  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>

<div id="player-root"></div>

<noscript>
  <div class="notice notice--warn" style="margin:24px">
    <b>RetroDeck needs JavaScript.</b>
    The library index, the console artwork and the emulator are all generated in the
    browser, so there is no server-rendered fallback to show you. Enable JavaScript, or
    read <code>docs/PLAYING.md</code> in the repository for what this project does.
  </div>
</noscript>

<script type="module" src="./js/app.js"></script>
<script nomodule>
  document.querySelector('#view').innerHTML =
    '<div class="notice notice--bad"><b>This browser is too old for ES modules.</b> RetroDeck targets 2020+ browsers (Safari 14+, Chrome 80+, Firefox 78+).</div>';
</script>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
