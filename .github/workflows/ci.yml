name: ci

# Every check in this file is the repo's own tooling: `npm test` needs no install
# at all (no dependencies), so a broken main is caught in ~20 seconds rather than
# by someone noticing the site does not boot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: versions
        run: node --version && npm --version && echo "::notice::no npm ci needed - the app and its tests have zero dependencies"
      - name: npm test
        run: npm test
      - name: deploy folder is complete
        run: npm run deploy:prepare && npm run deploy:check
      - name: generated catalogue matches data/source
        run: |
          npm run build
          if ! git diff --exit-code --quiet data/games.json js/data/games.generated.js; then
            echo "::error::data/games.json and js/data/games.generated.js are committed generated files that do not match data/source/games.tsv - run 'npm run build' and commit the result"
            git --no-pager diff --stat -- data/games.json js/data/games.generated.js
            exit 1
          fi

  browser:
    name: real browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Playwright is installed here and nowhere else: it stays out of package.json
      # so `npm test` remains runnable with no network and no install.
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - name: boot the app in chromium
        run: node tools/browser-check.mjs
      # A Contents-only token cannot read a job log, but it can read check-run
      # annotations - so the failure path prints what it needs to be diagnosable
      # from the API alone. browser-check.mjs emits ::error:: for every assertion
      # it fails, and this adds the runner's own facts around it.
      - name: what the runner had
        if: failure()
        run: |
          echo "::error::node $(node --version) / npm $(npm --version)"
          npx playwright --version 2>&1 | tail -1 | sed 's/^/::error::/'
          ls ~/.cache/ms-playwright 2>/dev/null | tr '\n' ' ' | sed 's/^/::error::browsers: /'
          free -m 2>/dev/null | tail -1 | sed 's/^/::error::mem: /'
          df -h /dev/shm 2>/dev/null | tail -1 | sed 's/^/::error::shm: /'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check
          path: |
            .browser-check/
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: deploy to GitHub Pages
    needs: [test, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `configure-pages` answers 400 while Settings ▸ Pages ▸ Source is still
      # "Deploy from a branch", and a permanently red job on main teaches people
      # to ignore red. So ask the API first: publish when Pages is listening to
      # Actions, otherwise say what to click - the branch pipeline is serving the
      # repository root in the meantime, and the app runs from there (relative
      # URLs only, no rewrite rules).
      - name: is Pages listening to Actions?
        id: src
        env:
          API: ${{ github.api_url }}
          TOK: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(curl -sf -H "authorization: Bearer $TOK" "$API/repos/$GITHUB_REPOSITORY/pages" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('source',{}).get('type',''))" 2>/dev/null || true)
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ "$type" != "github_actions" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Pages deploy skipped"
              echo
              echo "Pages source is \`${type:-unset}\`, not \`github_actions\`, so this workflow has"
              echo "nothing to publish into and \`actions/configure-pages\` would fail with a 400."
              echo
              echo "- The site the branch pipeline publishes is live at"
              echo "  https://$GITHUB_REPOSITORY.github.io/${GITHUB_REPOSITORY#*/}/ - that is the"
              echo "  repository root, and the app works from it as it is."
              echo "- To have CI publish \`dist/\` (the audited deploy folder) instead: **Settings ▸"
              echo "  Pages ▸ Source ▸ GitHub Actions**. No other change is needed; the next run on"
              echo "  main will deploy it."
              echo "- Note what neither folder can do on Pages: set response headers. Threads need"
              echo "  COOP + COEP, so hosted Pages runs single-threaded cores - see docs/DEPLOYING.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.src.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.src.outputs.skip != 'true'
        with:
          node-version: "22"
      - name: build the deploy folder
        if: steps.src.outputs.skip != 'true'
        run: npm run deploy:prepare
      - uses: actions/configure-pages@v5
        if: steps.src.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.src.outputs.skip != 'true'
        with:
          path: dist
      - id: deployment
        if: steps.src.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
